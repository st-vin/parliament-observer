<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${title}, ~{::section})}">
<th:block th:fragment="section">
    <h1 class="text-2xl font-bold mb-6">Browse by Date</h1>

    <div class="card p-4 mb-6" th:replace="~{fragments/calendar :: calendar}"></div>

    <section th:if="${selectedDate != null}">
        <h2 class="text-lg font-semibold mb-2"
            th:text="'Selected: ' + ${#temporals.format(selectedDate, 'EEEE, d MMMM yyyy')}">Selected date</h2>

        <p th:if="${noSitting}" class="text-gray-500 text-sm mb-4">
            Parliament did not sit on this date (or no sitting has been indexed yet).
        </p>

        <div th:if="${processing}" class="bg-warning/30 border border-warning text-sm px-3 py-2 rounded mb-4">
            This sitting is still being processed. Summaries may be incomplete.
        </div>

        <p th:if="${selectedSitting != null}" class="text-sm text-gray-600 mb-4"
           th:text="${selectedSitting.chamber()} + ' — ' + ${selectedSitting.proceedings().size()} + ' proceedings'"></p>

        <th:block th:each="proceeding : ${dayProceedings}">
            <article th:replace="~{fragments/proceeding-card :: card}"></article>
        </th:block>
    </section>
</th:block>
</html>
