<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<article th:fragment="card" class="card p-4 mb-3 hover:shadow-md transition-shadow">
    <div class="flex flex-wrap items-start justify-between gap-2 mb-2">
        <h3 class="font-semibold text-base flex-1">
            <a th:href="@{/proceedings/{id}(id=${proceeding.id})}" th:text="${proceeding.title}" class="hover:text-primary">Title</a>
        </h3>
        <th:block th:with="outcome=${proceeding.outcome}">
            <span th:replace="~{fragments/outcome-badge :: badge}"></span>
        </th:block>
    </div>
    <p class="text-xs text-gray-500 mb-2">
        <span th:text="${proceeding.proceedingType}">TYPE</span>
        <span th:if="${proceeding.sittingDate != null}"> · <span th:text="${proceeding.sittingDate}">date</span></span>
    </p>
    <div class="mb-2" th:if="${proceeding.topics != null and !proceeding.topics.isEmpty()}">
        <th:block th:each="t : ${proceeding.topics}">
            <span th:replace="~{fragments/topic-tag :: tag}"></span>
        </th:block>
    </div>
    <p class="text-sm text-gray-700 mb-3"
       th:text="${T(ke.co.bungesummary.web.WebViewHelper).summaryExcerpt(proceeding.plainSummary, 180)}">Summary excerpt</p>
    <a th:href="@{/proceedings/{id}(id=${proceeding.id})}" class="text-sm text-primary font-medium hover:underline">Read summary →</a>
</article>
</body>
</html>
