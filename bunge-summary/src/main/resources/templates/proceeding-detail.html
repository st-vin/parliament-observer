<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${title}, ~{::section})}">
<th:block th:fragment="section">
    <nav class="text-sm text-gray-500 mb-4">
        <a th:href="@{/}" class="hover:text-primary">Home</a>
        <span> / </span>
        <a th:href="@{/browse/date(year=${proceeding.sittingDate.year}, month=${proceeding.sittingDate.monthValue}, date=${proceeding.sittingDate})}"
           th:text="${proceeding.sittingDate}" class="hover:text-primary">Date</a>
        <span> / </span>
        <span class="line-clamp-1" th:text="${proceeding.title}">Title</span>
    </nav>

    <header class="card p-4 mb-4">
        <div class="flex flex-wrap justify-between gap-2 mb-2">
            <h1 class="text-xl sm:text-2xl font-bold flex-1" th:text="${proceeding.title}">Title</h1>
            <th:block th:with="outcome=${proceeding.outcome}">
                <span th:replace="~{fragments/outcome-badge :: badge}"></span>
            </th:block>
        </div>
        <p class="text-sm text-gray-500 mb-2">
            <span th:text="${proceeding.stage}">Stage</span>
            <span th:if="${proceeding.proceedingType != null}"> · <span th:text="${proceeding.proceedingType}">TYPE</span></span>
        </p>
        <p class="text-sm text-gray-600">
            <span th:text="${proceeding.sittingDate}">date</span> · National Assembly
        </p>
        <div class="mt-2" th:if="${proceeding.topics != null}">
            <th:block th:each="t : ${proceeding.topics}">
                <span th:replace="~{fragments/topic-tag :: tag}"></span>
            </th:block>
        </div>
    </header>

    <section class="card p-4 mb-4">
        <div th:replace="~{fragments/ai-label :: label}"></div>
        <div class="prose prose-sm max-w-none text-gray-800 whitespace-pre-line"
             th:text="${proceeding.plainSummary}">Summary</div>
        <details class="mt-4">
            <summary class="cursor-pointer text-sm text-primary font-medium">View source text from Hansard</summary>
            <pre class="mt-2 text-xs bg-gray-50 p-3 rounded overflow-x-auto whitespace-pre-wrap"
                 th:text="${proceeding.rawText}">Raw text</pre>
        </details>
    </section>

    <section class="card p-4 mb-4" th:if="${proceeding.contributions != null and !proceeding.contributions.isEmpty()}">
        <h2 class="font-semibold mb-3"
            th:text="'Member contributions (' + ${proceeding.contributions.size()} + ')'">Contributions</h2>
        <div th:each="c : ${proceeding.contributions}" class="border-b last:border-0 py-3">
            <div class="flex flex-wrap justify-between gap-2 mb-1">
                <p class="font-medium text-sm" th:text="${c.memberName}">MP</p>
                <span th:class="'text-xs font-semibold ' + ${T(ke.co.bungesummary.web.WebViewHelper).stanceBadgeClass(c.stance)}"
                      th:text="${c.stance != null ? c.stance : 'UNCERTAIN'}">STANCE</span>
            </div>
            <p th:if="${c.stance == 'UNCERTAIN' or c.stance == null}" class="text-xs text-gray-500 mb-1">
                Stance could not be determined from this contribution.
            </p>
            <p class="text-sm text-gray-700 mb-2" th:text="${c.summary}">Summary</p>
            <details th:if="${c.verbatimExcerpt != null}">
                <summary class="text-xs text-primary cursor-pointer">View source text</summary>
                <p class="text-xs text-gray-600 mt-1 italic" th:text="${c.verbatimExcerpt}">Excerpt</p>
            </details>
        </div>
    </section>

    <section class="text-sm text-gray-500" th:if="${proceeding.sourcePageStart != null}">
        <p>Official Hansard — pages <span th:text="${proceeding.sourcePageStart}">1</span>–<span th:text="${proceeding.sourcePageEnd}">2</span></p>
    </section>
</th:block>
</html>
