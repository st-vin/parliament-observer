spring:
  datasource:
    url: jdbc:h2:mem:auth_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-auth-it.sql
  flyway:
    enabled: false
  batch:
    jdbc:
      initialize-schema: always

jwt:
  secret: test-jwt-secret-minimum-32-characters-long-for-hs256
  expiration-ms: 86400000
