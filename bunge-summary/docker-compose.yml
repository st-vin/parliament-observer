services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bunge-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: bunge_summary
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Host 5433 avoids conflict with a local PostgreSQL install on 5432 (common on Windows).
      - "5433:5432"
    volumes:
      - bunge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d bunge_summary"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bunge_pg_data:
